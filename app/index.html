<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手势识别 · Motrack</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1a1e25;
    --line: #232830;
    --text: #e8ecf1;
    --muted: #8b95a5;
    --accent: #4c8dff;
    --ok: #3ddc97;
    --warn: #ffb454;
    --err: #ff6b6b;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 28px 24px 48px;
    background:
      radial-gradient(1200px 600px at 15% -10%, #16203180, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .badge.on  { color: var(--ok);   border-color: #1d4437; background: #10241d; }
  .badge.on .dot  { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .badge.off .dot { background: var(--err); }
  .badge.off { color: var(--err); border-color: #45201f; background: #24120f; }

  /* ---------- 布局 ---------- */
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }

  /* ---------- 视频区 ---------- */
  .stage { position: relative; background: #000; aspect-ratio: 4 / 3; }
  #cam, #overlay { display: block; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; }

  .stage-empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #4a5361; font-size: 13px; letter-spacing: .5px;
  }

  .corner {
    position: absolute; top: 12px; left: 12px;
    padding: 5px 10px; border-radius: 8px; font-size: 12px;
    background: #000000a8; backdrop-filter: blur(6px);
    border: 1px solid #ffffff14; color: var(--muted);
  }
  .corner.ok   { color: var(--ok); }
  .corner.warn { color: var(--warn); }
  .corner.err  { color: var(--err); }

  /* ---------- 结果卡 ---------- */
  .result { padding: 20px 20px 16px; }
  .label { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
           color: var(--muted); margin-bottom: 8px; }

  #gName {
    font-size: 30px; font-weight: 680; line-height: 1.15;
    letter-spacing: -.4px; word-break: break-all;
    transition: color .15s;
  }
  #gName.idle { color: #3f4754; font-weight: 500; font-size: 22px; }

  #gFeedback { margin-top: 8px; color: var(--muted); font-size: 13px; min-height: 18px; }

  .conf { margin-top: 18px; }
  .conf-head { display: flex; justify-content: space-between; font-size: 12px;
               color: var(--muted); margin-bottom: 7px; }
  .conf-track { height: 7px; border-radius: 99px; background: #0a0c0f; overflow: hidden; }
  .conf-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #2f6fd0, var(--accent));
    transition: width .18s ease, background .2s;
  }
  .conf-fill.hi  { background: linear-gradient(90deg, #1f9c6b, var(--ok)); }
  .conf-fill.mid { background: linear-gradient(90deg, #b3711f, var(--warn)); }

  /* ---------- 指标 ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    border-top: 1px solid var(--line);
  }
  .stat { padding: 12px 16px; }
  .stat:nth-child(odd) { border-right: 1px solid var(--line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .stat b { display: block; font-size: 17px; font-weight: 620; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }

  /* ---------- 控制区 ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px;
              border-top: 1px solid var(--line); }

  button {
    font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    cursor: pointer; transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: #212734; border-color: #2e3644; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #3f7ce8; }

  select, .file {
    font: inherit; font-size: 13px; padding: 9px 12px; border-radius: 9px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); max-width: 100%;
  }
  .file { cursor: pointer; }
  .file input { display: none; }

  /* ---------- 原始数据 ---------- */
  details { border-top: 1px solid var(--line); padding: 12px 16px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  #raw {
    margin: 10px 0 0; max-height: 220px; overflow: auto;
    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #9fb0c4; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Motrack<span>21 点特征 · 14 类手势</span></h1>
    <span class="badge" id="connBadge"><i class="dot"></i><span id="connText">未连接</span></span>
  </header>

  <div class="grid">

    <!-- 左：画面 -->
    <div class="card">
      <div class="stage">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="stage-empty" id="stageEmpty">摄像头未开启</div>
        <div class="corner" id="stateChip">待机</div>
      </div>

      <div class="controls">
        <button id="btnStart" class="primary">开启摄像头</button>
        <button id="btnStop" disabled>停止</button>
        <select id="devSel"></select>
        <label class="file">上传图片<input type="file" id="imgInput" accept="image/*"></label>
      </div>
    </div>

    <!-- 右：结果 + 指标 -->
    <div class="card">
      <div class="result">
        <div class="label">识别结果</div>
        <div id="gName" class="idle">等待输入</div>
        <div id="gFeedback">开启摄像头后对手部做手势</div>

        <div class="conf">
          <div class="conf-head"><span>置信度</span><span id="confVal">—</span></div>
          <div class="conf-track"><div class="conf-fill" id="confFill"></div></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b id="sFps">—</b><span>帧率 FPS</span></div>
        <div class="stat"><b id="sP50">—</b><span>延迟 p50</span></div>
        <div class="stat"><b id="sP95">—</b><span>延迟 p95</span></div>
        <div class="stat"><b id="sDrop">—</b><span>丢帧</span></div>
      </div>

      <details>
        <summary>原始响应</summary>
        <pre id="raw">—</pre>
      </details>
    </div>

  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000/api/Gestureinput';
const WS_URL = 'ws://127.0.0.1:8000/ws/gesture';
const STATS_URL = 'http://127.0.0.1:8000/api/stats';
const USE_WS = true;
const INTERVAL_MS = 60;

const cam = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const devSel = document.getElementById('devSel');
const imgInput = document.getElementById('imgInput');
const stageEmpty = document.getElementById('stageEmpty');
const stateChip = document.getElementById('stateChip');
const gName = document.getElementById('gName');
const gFeedback = document.getElementById('gFeedback');
const confFill = document.getElementById('confFill');
const confVal = document.getElementById('confVal');
const rawBox = document.getElementById('raw');
const connBadge = document.getElementById('connBadge');
const connText = document.getElementById('connText');

const EDGES = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const KEYS = [
  'wrist',
  'thumb_cmc','thumb_mcp','thumb_ip','thumb_tip',
  'index_finger_mcp','index_finger_pip','index_finger_dip','index_finger_tip',
  'middle_finger_mcp','middle_finger_pip','middle_finger_dip','middle_finger_tip',
  'ring_finger_mcp','ring_finger_pip','ring_finger_dip','ring_finger_tip',
  'pinky_mcp','pinky_pip','pinky_dip','pinky_tip'
];
const SIDE_COLOR = { left: '#40e0d0', right: '#ff9848' };

let stream = null;
let timer = null;
let busy = false;

let ws = null;
let wsReady = false;
let awaiting = false;
let retryMs = 1000;
let statsTimer = null;

/* ---------------------------------------------------------- 连接 */
function setBadge(on, text) {
  connBadge.classList.toggle('on', on);
  connBadge.classList.toggle('off', !on);
  connText.textContent = text;
}

function connectWs() {
  if (!USE_WS) { setBadge(false, 'HTTP 模式'); return; }

  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    wsReady = true;
    retryMs = 1000;
    setBadge(true, 'WS 已连接');
    if (!statsTimer) statsTimer = setInterval(pollStats, 1000);
  };

  ws.onclose = () => {
    wsReady = false;
    awaiting = false;
    setBadge(false, '连接断开 · 重试中');
    setTimeout(connectWs, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  };

  ws.onerror = () => { try { ws.close(); } catch (e) {} };

  ws.onmessage = (e) => {
    awaiting = false;
    try { render(JSON.parse(e.data)); } catch (err) { console.error(err); }
  };
}

/* ---------------------------------------------------------- 指标 */
async function pollStats() {
  try {
    const r = await fetch(STATS_URL, { cache: 'no-store' });
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById('sFps').textContent = s.fps.toFixed(1);
    document.getElementById('sP50').textContent = s.latency_ms.p50 + ' ms';
    document.getElementById('sP95').textContent = s.latency_ms.p95 + ' ms';
    document.getElementById('sDrop').textContent = s.frames_dropped;
  } catch (err) { /* 后端没起来就先不管 */ }
}

/* ---------------------------------------------------------- 摄像头 */
async function listCameras() {
  const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
  tmp.getTracks().forEach(t => t.stop());

  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  devSel.innerHTML = cams
    .map((d, i) => `<option value="${d.deviceId}">${d.label || '摄像头 ' + (i + 1)}</option>`)
    .join('');
}

cam.addEventListener('loadedmetadata', () => {
  overlay.width = cam.videoWidth;
  overlay.height = cam.videoHeight;
  stageEmpty.hidden = true;
});

btnStart.addEventListener('click', async () => {
  try {
    if (!devSel.options.length) await listCameras();

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: devSel.value ? { exact: devSel.value } : undefined,
        width: 640,
        height: 480
      }
    });

    cam.srcObject = stream;
    btnStart.disabled = true;
    btnStop.disabled = false;
    if (USE_WS && !wsReady) connectWs();
    timer = setInterval(tick, INTERVAL_MS);
  } catch (err) {
    console.error('摄像头打开失败', err);
    gFeedback.textContent = '摄像头打不开：' + err.message;
  }
});

btnStop.addEventListener('click', () => {
  clearInterval(timer);
  timer = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  btnStart.disabled = false;
  btnStop.disabled = true;
  stageEmpty.hidden = false;
  setState('待机', '');
  awaiting = false;
});

/* ---------------------------------------------------------- 抽帧 */
function tick() {
  if (!cam.videoWidth) return;
  if (USE_WS) {
    if (!wsReady || awaiting) return;
    awaiting = true;
    captureBlob().then(b => b.arrayBuffer()).then(buf => {
      if (wsReady) ws.send(buf); else awaiting = false;
    }).catch(() => { awaiting = false; });
  } else {
    sendFrame(captureFrame());
  }
}

function drawToCanvas() {
  const c = document.createElement('canvas');
  c.width = cam.videoWidth;
  c.height = cam.videoHeight;
  c.getContext('2d').drawImage(cam, 0, 0);
  return c;
}

function captureBlob() {
  return new Promise(res => drawToCanvas().toBlob(res, 'image/jpeg', 0.7));
}

function captureFrame() {
  return drawToCanvas().toDataURL('image/jpeg', 0.7);
}

async function sendFrame(dataUrl) {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ img_64: dataUrl })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (err) {
    console.error('请求失败', err);
  } finally {
    busy = false;
  }
}

imgInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  await sendFrame(dataUrl);
});

/* ---------------------------------------------------------- 渲染 */
const STATE_TEXT = {
  ready: ['已识别', 'ok'],
  low_confidence: ['置信度低', 'warn'],
  no_person: ['未检测到手', 'err']
};

function setState(text, cls) {
  stateChip.textContent = text;
  stateChip.className = 'corner ' + (cls || '');
}

function render(data) {
  const [text, cls] = STATE_TEXT[data.state] || [data.state || '—', ''];
  setState(text, cls);

  const name = data.gesture_name || '';
  gName.textContent = name || '未识别';
  gName.classList.toggle('idle', !name);
  gFeedback.textContent = data.feedback || '';

  const conf = Number(data.confidence || 0);
  confFill.style.width = Math.round(conf * 100) + '%';
  confFill.className = 'conf-fill ' + (conf >= 0.75 ? 'hi' : conf >= 0.5 ? 'mid' : '');
  confVal.textContent = name ? Math.round(conf * 100) + '%' : '—';

  rawBox.textContent = JSON.stringify(data, null, 2);
  drawSkeleton(data.keypoints);
}

function drawSkeleton(keypoints) {
  const ctx = overlay.getContext('2d');
  const w = overlay.width, h = overlay.height;
  ctx.clearRect(0, 0, w, h);
  if (!keypoints) return;

  const sides = [...new Set(Object.keys(keypoints).map(k => k.split('_')[0]))];

  for (const side of sides) {
    const pts = KEYS.map(k => keypoints[`${side}_${k}`]);
    if (pts.some(p => !p)) continue;

    const color = SIDE_COLOR[side] || '#7f8ea3';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const [a, b] of EDGES) {
      ctx.moveTo(pts[a][0] * w, pts[a][1] * h);
      ctx.lineTo(pts[b][0] * w, pts[b][1] * h);
    }
    ctx.stroke();

    ctx.fillStyle = color;
    for (const p of pts) {
      ctx.beginPath();
      ctx.arc(p[0] * w, p[1] * h, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
</script>
</body>
</html>
